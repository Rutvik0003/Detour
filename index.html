<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EF">
  <title>Detour · prototype</title>
  <link rel="stylesheet" href="css/inter.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="stage">
    <!-- Desktop-only side panel: welcome card, tour step guide, or jump list (filled by app.js) -->
    <aside class="panel" id="panel" aria-label="About this prototype"></aside>

    <div class="phone-wrap">
      <div class="phone">
        <div class="phone__screen" id="phoneScreen" data-theme="light">
          <div class="statusbar" aria-hidden="true">
            <span id="clock">8:00</span>
            <span class="statusbar__icons">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1" fill="currentColor" stroke="none"/></svg>
              <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="currentColor"/><path d="M25 4.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".5"/></svg>
            </span>
          </div>
          <div class="island" aria-hidden="true"></div>

          <main class="viewport" id="viewport"></main>
          <nav class="tabbar is-hidden" id="tabbar" aria-label="Main"></nav>
          <!-- Phone-width only: slim tour bar, day-simulator chips and welcome card -->
          <div class="tourbar" id="tourbar" aria-live="polite"></div>
          <div class="simbar" id="simbar"></div>
          <div class="welcome-layer" id="welcome"></div>

          <button class="notif" id="notif" type="button" aria-hidden="true"></button>
          <div class="sheet-layer" id="sheetLayer"></div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
          <div class="homebar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden demo menu: press D -->
  <div class="demo" id="demo" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/model.js"></script>
  <script src="js/screens-onboard.js"></script>
  <script src="js/screens-app.js"></script>
  <script src="js/screens-friends.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
